<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hossam Ali — Backend Laravel Developer and Cybersecurity Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ff2d20" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .scan{animation:scan 6s ease-in-out infinite}
      @keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(150px)}}
      .fade{opacity:0;animation:fade .6s ease forwards}
      .d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}.d5{animation-delay:2.7s}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowB)"/>

  <!-- left: identity -->
  <g transform="translate(64 0)">
    <rect x="0" y="70" width="128" height="26" rx="13" fill="#ff2d20" fill-opacity="0.14" stroke="#ff2d20" stroke-opacity="0.5"/>
    <text x="64" y="88" text-anchor="middle" class="mono" font-size="12" fill="#ff8a80" letter-spacing="1.5">FROM EGYPT 🇪🇬</text>
    <text x="0" y="158" class="sans" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-1">Hossam Ali</text>
    <text x="2" y="198" class="sans" font-size="22" font-weight="600" fill="#e2e8f0">Backend Developer <tspan fill="#ff2d20">·</tspan> Laravel &amp; PHP</text>
    <text x="2" y="230" class="sans" font-size="18" fill="#94a3b8">Cybersecurity enthusiast — building secure, scalable systems</text>
    <g class="mono" font-size="13" fill="#cbd5e1">
      <rect x="0" y="252" width="98" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="49" y="271" text-anchor="middle">Laravel</text>
      <rect x="108" y="252" width="98" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="157" y="271" text-anchor="middle">REST APIs</text>
      <rect x="216" y="252" width="98" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="265" y="271" text-anchor="middle">MySQL</text>
      <rect x="324" y="252" width="118" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="383" y="271" text-anchor="middle">Blue Team</text>
    </g>
  </g>

  <!-- right: terminal -->
  <g transform="translate(700 46)">
    <rect width="440" height="228" rx="12" fill="#0a0f1c" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="440" height="34" rx="12" fill="#151c2f"/>
    <rect y="22" width="440" height="12" fill="#151c2f"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>
    <text x="220" y="22" text-anchor="middle" class="mono" font-size="12" fill="#64748b">hossam@sec-lab: ~</text>
    <g clip-path="inset(0)">
      <rect class="scan" x="0" y="40" width="440" height="30" fill="#22d3ee" fill-opacity="0.04"/>
    </g>
    <g class="mono" font-size="14">
      <text x="20" y="66" class="fade d1"><tspan fill="#22c55e">➜</tspan><tspan fill="#38bdf8"> ~ </tspan><tspan fill="#e2e8f0">php artisan serve --secure</tspan></text>
      <text x="20" y="92" class="fade d2" fill="#94a3b8">  ✔ api.v1 ready · auth: sanctum · rbac: on</text>
      <text x="20" y="122" class="fade d3"><tspan fill="#22c55e">➜</tspan><tspan fill="#38bdf8"> ~ </tspan><tspan fill="#e2e8f0">grep "Failed password" auth.log | wc -l</tspan></text>
      <text x="20" y="148" class="fade d4" fill="#f87171">  ⚠ 1,284 attempts · brute-force from 3 IPs</text>
      <text x="20" y="178" class="fade d5"><tspan fill="#22c55e">➜</tspan><tspan fill="#38bdf8"> ~ </tspan><tspan fill="#e2e8f0">./block.sh &amp;&amp; echo "secured"</tspan></text>
      <text x="20" y="204" class="fade d5" fill="#a7f3d0">  secured<tspan class="cursor" fill="#e2e8f0"> █</tspan></text>
    </g>
  </g>
</svg>
